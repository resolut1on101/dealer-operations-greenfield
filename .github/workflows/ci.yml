name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run supabase -- start -x studio,imgproxy,logflare,vector
      - run: npm run supabase -- db reset --local
      - run: npm run test:rls
      - run: npm run test:import
      - run: npm run test:customer-domain
      - run: npm run test:product-domain
      - run: npm run test:product-concurrency
